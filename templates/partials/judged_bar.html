<div class="judged-bar" title="{{ percent }}% {{ label }}">
  <div class="progress" role="progressbar" aria-valuenow="{{ percent }}" aria-valuemin="0" aria-valuemax="100" aria-label="{{ label|capfirst }}"><span style="width:{{ percent }}%"></span></div>
  <span class="muted small">{{ percent }}% {{ label }}</span>
</div>
