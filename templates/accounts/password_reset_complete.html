{% extends "base.html" %}

{% block title %}Password changed · {{ org.name }}{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1 style="font-size:1.6rem">Password changed</h1>
    <p class="muted">You can now log in with your new password.</p>
    <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Log in</a>
  </div>
</div>
{% endblock %}
