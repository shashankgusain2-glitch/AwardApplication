name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: awards
          POSTGRES_USER: awards
          POSTGRES_PASSWORD: awards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awards"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://awards:awards@localhost:5432/awards
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pytest
      - name: Dependency security scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements/base.txt -r requirements/prod.txt
        continue-on-error: true   # report only for now; make it blocking once the list is clean

  prod-image:
    # The production image builds, runs as non-root, and passes Django's deployment checks.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.prod
        run: docker build -f Dockerfile.prod -t awards-platform:ci .
      - name: Deployment checks (check --deploy)
        run: >
          docker run --rm
          -e SECRET_KEY=ci-only-0123456789abcdefghijklmnopqrstuvwxyz-0123456789
          -e JWT_SIGNING_KEY=ci-only-jwt-0123456789abcdefghijklmnop
          -e ALLOWED_HOSTS=awards.example.org
          -e SECURE_HSTS_PRELOAD=True
          awards-platform:ci python manage.py check --deploy --fail-level WARNING
      - name: Runs as a non-root user
        run: test "$(docker run --rm awards-platform:ci whoami)" = "app"
